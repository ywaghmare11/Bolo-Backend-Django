name: CI

# Runs on every PR and on every push to main. All four jobs must pass before a
# branch is mergeable (branch protection enforces that on GitHub's side).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # A newer push to the same branch cancels the in-flight run for it.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - run: ruff check .

  test:
    name: Tests (pytest + migration check)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bolo
          POSTGRES_PASSWORD: bolo
          POSTGRES_DB: bolo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bolo"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # config.settings.test (forced by pytest.ini) still imports base.py, which
      # validates these at startup -- crash-early by design, so CI must supply them.
      DJANGO_SECRET_KEY: ci-not-secret
      JWT_SECRET: ci-not-secret
      DATABASE_URL: postgresql://bolo:bolo@localhost:5432/bolo_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      # Cheap gate: fails if a model change was made without a matching migration.
      - name: Missing-migration check
        run: python manage.py makemigrations --check --dry-run
      - name: pytest
        run: pytest -q

  security:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      # Audit the pinned production dependency set. Exits non-zero on a known CVE
      # so a vulnerable dependency can't be merged unnoticed.
      - run: pip-audit -r requirements/prod.txt

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: bolo-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-check the built image
        run: |
          docker run --rm \
            -e DJANGO_SECRET_KEY=ci -e JWT_SECRET=ci \
            -e DATABASE_URL=sqlite:// -e REDIS_URL=redis://localhost:6379/0 \
            -e ALLOWED_HOSTS=localhost \
            --entrypoint python bolo-backend:ci manage.py check --deploy --fail-level ERROR
